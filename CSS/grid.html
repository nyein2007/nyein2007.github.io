<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <link rel="stylesheet" href="Css/custom.css">

</head>

<body>
    <h1>Grid lesson</h1>
    <div class="gridone">
        <div style="background-color: blue;">1</div>
        <div style="background-color: green;">2</div>
        <div style="background-color: red;">3</div>
        <div style="background-color: yellow">4</div>
        <div style="background-color: pink;">5</div>
        <div style="background-color: black">6</div>
        <div style="background-color:brown">7</div>
        <div style="background-color: orange">8</div>
        <div style="background-color: purple">9</div>
    </div>

    <h1>Grid colum add</h1>
    <div class="gridtwo">
        <div style="background-color: blue;" class="gridcolumadd">1</div>
        <div style="background-color: green;">2</div>
        <div style="background-color: red;" >3</div>
        <div style="background-color: yellow">4</div>
        <div style="background-color: pink;">5</div>
        <div style="background-color: black">6</div>
        <div style="background-color:brown">7</div>
        <div style="background-color: orange">8</div>
        <div style="background-color: purple">9</div>
    </div>
    <div class="gridthree">
        <div style="background-color: blue;" class="gridcolumadd">1</div>
        <div style="background-color: green;">2</div>
        <div style="background-color: red;" >3</div>
        <div style="background-color: yellow">4</div>
        <div style="background-color: pink;">5</div>
        <div style="background-color: black">6</div>
        <div style="background-color:brown">7</div>
        <div style="background-color: orange">8</div>
        <div style="background-color: purple">9</div>
    </div>
</body>

</html>
